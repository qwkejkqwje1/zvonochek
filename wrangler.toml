name = "zvonochek"
main = "worker/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://qwkejkqwje1.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Inbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatRoom"]

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Pairing"]
